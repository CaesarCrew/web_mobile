{% extends 'base.html' %}

{% load static %}

{% block content %}
<div class="container-sm d-flex align-items-center justify-content-center flex-column" style="height: 100vh;">
    {% if error %}
    <div class="alert alert-danger" role="alert">
        {{ error }}
    </div>
    {% endif %}
    
    <h1 class="mb-3 fw-normal">Login</h1>
    <form class="row g-3" action="{% url 'login' %}" method="post">
        {% csrf_token %}
        <div class="form-floating">
            <input name="username" class="form-control" id="floatingUsername" placeholder="Usuário" required>
            <label for="floatingUsername">Usuário</label>
        </div>
        <div class="form-floating">
            <input type="password" name="password" class="form-control" id="floatingPassword" required>
            <label for="floatingPassword">Senha</label>
        </div>
        <div class="col-12">
        <button type="submit" class="btn btn-primary w-100 py-2">Entrar</button>
        </div>
    </form>
</div>
{% endblock %}
