{% extends 'base.html' %}

{% load static %}

{% block content %}
<div class="container-sm d-flex align-items-center justify-content-center flex-column" style="height: 100vh;">
    {% if error %}
    <div class="alert alert-danger" role="alert">
        {{ error }}
    </div>
    {% endif %}

    <h1>Cadastrar Veículo</h1>
    <form action="{% url 'criar_veiculo' %}" method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label>Modelo</label>
            <input type="text" class="form-control" name="modelo" required>
        </div>

        <div class="mb-3">
            <label>Combustível</label>
            <select name="combustivel" class="form-select" aria-label="Default select example">
                <option selected>Selecione</option>
                {% for comb in opcoes_combustiveis %}
                    <option value="{{ comb.0 }}">{{ comb.1 }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label>Marca</label>
            <select name="marca" class="form-select" aria-label="Default select example">
                <option selected>Selecione uma marca</option>
                {% for marca in opcoes_marcas %}
                    <option value="{{ marca.0 }}">{{ marca.1 }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label>Cor</label>
            <select name="cor" class="form-select" aria-label="Default select example">
                <option selected>Selecione uma cor</option>
                {% for cor in opcoes_cores %}
                    <option value="{{ cor.0 }}">{{ cor.1 }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
        <label>Ano</label>
        <input type="number" name="ano" class="form-control" required>
        </div>
        <input type="reset" value="Limpar">
        <br>
        <br>
        <input type="submit" class="btn btn-primary w-100 py-2" value="Cadastrar">
    </form>
</div>
{% endblock%}
